name: Sentinel

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      reasons: ${{ steps.check.outputs.reasons }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read stored state from the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The contents API, not raw.githubusercontent.com: raw is CDN-cached, so
          # a baseline written minutes earlier can read back stale and hide a change.
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.sentinel/state.json?ref=data" --jq .content \
              | base64 -d > "$RUNNER_TEMP/solid.json"; then
            echo "read $(wc -c < "$RUNNER_TEMP/solid.json") bytes of stored state"
          else
            echo "::notice::No state on the data branch yet; every dist-tag counts as new."
          fi
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm run sentinel -- \
            --state "$RUNNER_TEMP/solid.json" \
            --write "$RUNNER_TEMP/observed.json" \
            --report "$GITHUB_OUTPUT"
      - name: Keep the observation for the record job
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-observation
          path: ${{ runner.temp }}/observed.json
          retention-days: 7
      - name: Dispatch collection and verification
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::Changed: ${{ steps.check.outputs.reasons }}"
          for workflow in collect.yml verify.yml; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" >/dev/null 2>&1; then
              gh workflow run "$workflow" --ref main \
                && echo "dispatched ${workflow}" \
                || echo "::warning::Could not dispatch ${workflow}"
            else
              echo "::notice::${workflow} is not defined yet; skipping (see #2 and #4)."
            fi
          done

  record:
    name: record
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data
          path: state
      - uses: actions/download-artifact@v8
        with:
          name: sentinel-observation
      - name: Commit the observation to the data branch
        working-directory: state
        run: |
          mkdir -p .sentinel
          cp ../observed.json .sentinel/state.json
          git config user.name "solid-ground-sentinel"
          git config user.email "sentinel@users.noreply.github.com"
          git add .sentinel/state.json
          git commit -m "chore(sentinel): record observation"
          git push
