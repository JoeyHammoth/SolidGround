name: Verify

# Phase 0 of the sandboxed matrix (issue #4): harness plus controls, three
# hand-picked packages, Harden-Runner in audit mode. A scheduled run cannot
# change a record: folding a batch into the dataset needs the manual `publish`
# input, and only after the controls have run clean for two weeks.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-test cells that already have a fresh result
        type: boolean
        default: false
      packages:
        description: Comma-separated package names
        type: string
        default: ""
      max-cells:
        description: Cap on package cells per batch
        type: string
        default: "3"
      publish:
        description: Fold this batch into the data branch (only after the two-week gate)
        type: boolean
        default: false
  schedule:
    # Nightly, after collect has refreshed the dataset at 03:17.
    - cron: "10 4 * * *"

permissions: {}

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check out the published dataset
        uses: actions/checkout@v7
        # Without a data branch every cell is planned, which is the honest
        # bootstrap answer; only the plan step's own reads have to succeed.
        continue-on-error: true
        with:
          ref: data
          path: data
          persist-credentials: false
      - name: Plan the batch
        id: plan
        env:
          PACKAGES: ${{ inputs.packages || '@solid-primitives/storage,@solidjs/meta,@kobalte/core' }}
          MAX_CELLS: ${{ inputs.max-cells || '3' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          rm -rf data/.git
          extra=()
          if [ "$FORCE" = "true" ]; then extra+=(--force); fi
          pnpm run smoke:plan \
            --data data \
            --packages "$PACKAGES" \
            --max-cells "$MAX_CELLS" \
            "${extra[@]}" \
            --out smoke-plan.json
          echo "cells=$(jq -c '.cells' smoke-plan.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.cells | length' smoke-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-plan
          path: smoke-plan.json
          retention-days: 7

  smoke:
    name: smoke ${{ matrix.cell.id }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # One package per job: a compromise sees one job token with read access
      # and nothing else. The publish path never runs package code.
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      # Audit first. Promote to `block` with only registry.npmjs.org and the
      # GitHub hosts once two clean weeks of control runs are on record.
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the cell
        env:
          SPEC: ${{ toJSON(matrix.cell) }}
          CELL_ID: ${{ matrix.cell.id }}
          SMOKE_REPO_ROOT: ${{ github.workspace }}
          SMOKE_WORKDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          # `pnpm exec`, not `pnpm run`: the run banner would prefix stdout and
          # corrupt the JSON artifact.
          printf '%s' "$SPEC" | pnpm exec tsx packages/smoke/src/runner.ts | tee "$RUNNER_TEMP/$CELL_ID.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cell-${{ matrix.cell.id }}
          path: ${{ runner.temp }}/${{ matrix.cell.id }}.json
          if-no-files-found: warn
          retention-days: 7

  report:
    name: report
    needs: [plan, smoke]
    # Runs after a partial batch too: a missing cell artifact is exactly what
    # the control check is supposed to notice.
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: cell-*
          path: results
          merge-multiple: true
      - name: Validate the artifacts and the controls
        run: pnpm run smoke:report --dir results --out smoke/results.ndjson --controls-out smoke/controls.jsonl
      - name: Add this batch's control verdicts to the summary
        if: always()
        run: pnpm run smoke:status --file smoke/controls.jsonl --last 1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke
          path: smoke
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish
    needs: [plan, report]
    # The only path that changes a record. It is manual on purpose: phase 0
    # requires two weeks of clean controls first, and a schedule must never be
    # able to publish by itself. This job runs no package code.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      issues: write
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
      - uses: actions/download-artifact@v8
        with:
          name: smoke
          path: smoke
      - name: Fold the batch into the published edition
        # Refuses until the control log holds fourteen clean days. A maintainer
        # bootstrap can pass --skip-audit locally; CI never does.
        run: pnpm run smoke:publish --data data --results smoke/results.ndjson
      - name: Validate the folded dataset
        run: pnpm run validate data
      - name: Commit the dataset to the data branch
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "solid-ground-verify"
          git config user.email "verify@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No record changed; nothing to publish."
            exit 0
          fi
          git commit -m "chore(data): fold smoke batch $(date -u +%FT%TZ)"
          git push
          # A push made with GITHUB_TOKEN does not trigger other workflows.
          gh workflow run deploy.yml --ref main
      - name: Close the gate notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run smoke:gate --close

  history:
    name: control history
    needs: [plan, report]
    # Every batch, including a discarded one: the two-week audit is only
    # meaningful if the failures are on record too. Writes one log file and
    # never a record, and runs no package code.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
      - uses: actions/download-artifact@v8
        with:
          name: smoke
          path: smoke
      - name: Append this batch's control verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f smoke/controls.jsonl ]; then
            echo "::notice::This batch carries no control results; nothing to record."
            exit 0
          fi
          mkdir -p data/smoke
          touch data/smoke/controls.jsonl
          # Keep the log replayable: a line already on record is not written twice.
          awk '!seen[$0]++' data/smoke/controls.jsonl smoke/controls.jsonl > data/smoke/controls.tmp
          mv data/smoke/controls.tmp data/smoke/controls.jsonl
          # Bound the file: raw results for the retention window, one summary per
          # archived month before it.
          pnpm run smoke:compact --file data/smoke/controls.jsonl
          git -C data config user.name "solid-ground-verify"
          git -C data config user.email "verify@users.noreply.github.com"
          git -C data add smoke/controls.jsonl
          if git -C data diff --cached --quiet; then
            echo "::notice::Control log unchanged; nothing to record."
            exit 0
          fi
          git -C data commit -m "chore(data): record smoke controls $(date -u +%FT%TZ)"
          git -C data push
          gh workflow run deploy.yml --ref main
      - name: Summarize the audit trail
        if: always()
        run: pnpm run smoke:status --file data/smoke/controls.jsonl --last 14 >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: blocked audit
    # Independent of the matrix: a stale research note must neither stop the
    # control runs nor go unnoticed, so this job owns an issue instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: data
          path: data
          persist-credentials: false
      - name: Validate the published dataset
        # Every scheduled run checks the edition itself, so a hand edit or a bad
        # write surfaces here instead of at the next publish.
        run: |
          set -euo pipefail
          if [ ! -f data/index.json ]; then
            echo "::notice::No dataset checkout; skipping dataset validation."
            exit 0
          fi
          pnpm run validate data
      - name: Compare the committed audit with the published edition
        id: audit
        run: |
          set -euo pipefail
          if [ ! -f data/index.json ]; then
            echo "::notice::No dataset checkout; skipping the blocked-package audit check."
            echo "stale=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm run audit:blocked --data data --check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ steps.audit.outputs.stale }}" in
            true)
              # Creates or comments, then fails the job: the issue is the durable
              # record, the red run is the nudge.
              pnpm run audit:issue --stale
              exit 1
              ;;
            false)
              pnpm run audit:issue --clean
              ;;
            *)
              echo "::notice::Audit check skipped; no issue to sync."
              ;;
          esac
      - name: Announce the publish gate
        # Runs even when the audit step failed: the control log is independent
        # of the note, and a met gate must not wait for a doc fix.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run smoke:gate --file data/smoke/controls.jsonl --notify
