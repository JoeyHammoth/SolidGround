name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the published dataset
        id: dataset
        uses: actions/checkout@v7
        # A missing or unreadable data branch must degrade to the committed
        # fixtures, never fail the deploy: a stale site beats no site.
        continue-on-error: true
        with:
          ref: data
          path: data
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Choose the dataset to build from
        run: |
          rm -rf data/.git
          if [ -f data/index.json ]; then
            echo "DATA_DIR=$PWD/data" >> "$GITHUB_ENV"
            echo "Building from the \`data\` branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DATA_DIR=$PWD/fixtures/dataset" >> "$GITHUB_ENV"
            echo "::warning::The data branch is unavailable; building from fixtures/dataset."
            echo "The \`data\` branch was unavailable, so this deploy used the fixtures in \`fixtures/dataset\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate the dataset before publishing a site from it
        run: |
          set -o pipefail
          pnpm --silent run validate "$DATA_DIR" --json | tee "$DATA_DIR/validation.json"
      - name: Build
        run: pnpm run site:build
        env:
          SITE_BASE: /SolidGround
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
