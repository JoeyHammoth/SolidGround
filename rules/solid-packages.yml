# Watched by the hourly sentinel. A change in any dist-tag invalidates prior
# verification and dispatches the collect + verify workflows.
version: "2026.11.1"

packages:
  - solid-js
  - "@solidjs/web"
  - "@solidjs/signals"
  - "@solidjs/vite-plugin"
  - babel-preset-solid

docs:
  migration: https://docs.solidjs.com/migration/from-solid-1
  # The rendered page refuses CI egress with a 403, so the sentinel hashes the
  # page source instead. Keep the rendered URL: it is what readers are sent to.
  migrationSource: https://raw.githubusercontent.com/solidjs/solid-docs/v2-rebuild/src/routes/(6)migration/(0)from-solid-1.mdx
  aiTools: https://docs.solidjs.com/guides/ai-tools
